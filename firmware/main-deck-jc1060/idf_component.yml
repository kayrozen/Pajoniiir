## Explicit component pins.
## v76: esp_hosted host bumped 2.12.0 -> 2.12.13 - the C6 slave is now
## 2.12.12 (flashed by EspControl recovery). Issue espressif/esp-hosted-mcu
## #223 (EHM-255): P4 SDIO boot loops with the 2.12.12 slave when the host
## lacks the 2.12.13 "fixed sdio incorrect identification of all-ones bus
## read" fix. esp_wifi_remote 1.6.2 already satisfies >=1.3.1 (required by
## esp_hosted >=2.11.0).
dependencies:
  # v84: exact versions used by ESPHome's esp32_hosted component (EspControl
  # connects with this pairing) - see esphome/components/esp32_hosted/__init__.py
  espressif/esp_hosted: "==2.12.12"
  espressif/esp_wifi_remote: "==1.6.3"
  espressif/wifi_remote_over_eppp: "==0.3.3"
  espressif/eppp_link: "==1.1.5"
  ## 2.9.0 uses esp_lcd's on_frame_buf_complete (newer than IDF 6.0.2).
  espressif/esp_lvgl_port: "==2.8.0"
